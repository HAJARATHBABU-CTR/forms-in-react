<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Form</title>

  <style>
    .container {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      box-sizing: border-box;
    }

    button {
      padding: 8px 16px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Simple Form</h2>

    <form id="simpleForm">
      <label>jaanu:</label>
      <br>

      <input
        type="text"
        id="jaanu"
        required
      >

      <br><br>

      <button type="submit">Submit</button>
    </form>

    <p id="message" style="display: none;"></p>
  </div>

  <script src="script.js"></script>

</body>
</html>
